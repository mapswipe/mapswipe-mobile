name: CI
on:
  pull_request:
  push:
    branches:
      - develop
      - main

env:
  EXPO_PUBLIC_GRAPHQL_CODEGEN_ENDPOINT: './backend/schema.graphql'
  
jobs:
  lint_typecheck:
    name: 🚴 Lint + Typecheck 🚴
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # actions/checkout leaves a depth-1 clone of the PR merge commit, so the base branch is not
      # present and `git show <base>:<file>` cannot work until it is fetched.
      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      # Runs before Lint: a glob or a stale entry in the allowlist leaves Lint passing, so this is
      # the only signal for it, and it is far quicker than codegen + Lint.
      - name: Check styling allowlist only shrinks
        if: github.event_name == 'pull_request'
        run: pnpm check:styling-allowlist

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Check for unused files
        run: pnpm lint:unused
